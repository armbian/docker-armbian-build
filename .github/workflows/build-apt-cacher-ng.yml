name: apt-cacher-ng Image
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apt-cacher-ng.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Weekly, Monday 04:00 UTC — pick up trixie point/security updates

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: "Build apt-cacher-ng (trixie)"
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'DOCKEREOF'
          # Current apt-cacher-ng from Debian trixie (3.7.x) — the classical
          # multi-repo caching apt proxy. Replaces the abandoned 2020
          # sameersbn/apt-cacher-ng:3.3 image with ~4 years of reliability
          # fixes (index handling, concurrency, HTTPS remapping).
          FROM debian:trixie-slim

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                apt-cacher-ng \
                ca-certificates \
                curl && \
              rm -rf /var/lib/apt/lists/*

          # Override config: cache on a bind-mountable volume, run in the
          # foreground (PID 1), allow HTTPS repos via CONNECT tunneling, and
          # never expire cached packages (host has plenty of disk).
          RUN printf '%s\n' \
                'CacheDir: /var/cache/apt-cacher-ng' \
                'LogDir: /var/log/apt-cacher-ng' \
                'ForeGround: 1' \
                'PassThroughPattern: .*' \
                'ExThreshold: 0' \
                'VerboseLog: 0' \
                > /etc/apt-cacher-ng/zzz_armbian.conf

          # Fetch Armbian repositories from mirrors directly, not through the
          # apt/beta.armbian.com redirector: through it, apt update fails with
          # "File has unexpected size ... Mirror sync in progress?".
          # The start script refreshes the mirror lists from the redirector;
          # these two plain-HTTP mirrors are the fallback.
          RUN printf '%s\n' \
                'http://fi.mirror.armbian.de/apt/' \
                'http://armbian.lv.auroradev.org/apt/' \
                > /etc/apt-cacher-ng/backends_armbian_apt && \
              printf '%s\n' \
                'http://fi.mirror.armbian.de/beta/' \
                'http://armbian.lv.auroradev.org/beta/' \
                > /etc/apt-cacher-ng/backends_armbian_beta && \
              printf '%s\n' \
                'Remap-armapt: apt.armbian.com ; file:backends_armbian_apt' \
                'Remap-armbeta: beta.armbian.com ; file:backends_armbian_beta' \
                > /etc/apt-cacher-ng/zzzz_armbian_remap.conf

          # Keep the Armbian mirror lists current: refresh them from the
          # redirector every 5 minutes, restart apt-cacher-ng when a mirror is behind.
          COPY --chmod=0755 <<'EOS' /usr/local/sbin/armbian-acng-start
          #!/bin/sh
          # Keep the Armbian mirror lists current. apt-cacher-ng reads them only at start.
          conf=/etc/apt-cacher-ng
          interval="${ARMBIAN_MIRROR_REFRESH:-300}"

          # Print "<control stamp> <url>" when a mirror serves InRelease and answers 404
          # for a missing file. Prefer HTTPS.
          probe() {
          	for try in "https://${1#*://}" "${1}"; do
          		curl -fsS -m 10 -o /dev/null "${try}dists/noble/InRelease" || continue
          		[ "$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "${try}dists/noble/missing")" = 404 ] || continue
          		stamp=$(curl -fsSL -m 10 "${try}control" | tr -cd 0-9)
          		echo "${stamp:-0} ${try}"
          		return
          	done
          }

          # Probe all mirrors of a repository from the redirector at the same time.
          probe_all() {
          	tmp=$(mktemp -d)
          	n=0
          	for url in $(curl -fsS -m 15 "http://${1}.armbian.com/mirrors" | grep -o '"http[^"]*"' | tr -d '"' | sort -u); do
          		n=$((n + 1))
          		probe "${url}" > "${tmp}/${n}" &
          	done
          	wait
          	cat "${tmp}"/* 2> /dev/null
          	rm -rf "${tmp}"
          }

          # Write the mirror lists: the mirrors with the newest control stamp.
          # Armbian mirrors first: they sync right after a publish. Random order in each group.
          # $1 = start: write the lists. Else write them only when a listed mirror is behind:
          # a mirror that times out once must not cause a restart.
          # Return 1 when a list changed.
          update() {
          	changed=0
          	for repo in apt beta; do
          		file="${conf}/backends_armbian_${repo}"
          		all=$(probe_all "${repo}")
          		newest=$(printf '%s\n' "${all}" | sort -n | tail -n 1 | cut -d ' ' -f 1)
          		# Redirector not reachable: keep the current list.
          		[ -n "${newest}" ] || continue
          		new=$(printf '%s\n' "${all}" | awk -v n="${newest}" 'NF == 2 && $1 == n { print $2 }' | shuf |
          			awk '/\.armbian\.(com|de)\// { print; next } { rest = rest $0 "\n" } END { printf "%s", rest }')
          		if [ "${1}" = start ]; then
          			[ "$(printf '%s\n' "${new}" | sort)" = "$(sort "${file}")" ] && continue
          		else
          			behind=$(printf '%s\n' "${all}" | awk -v n="${newest}" 'NF == 2 && $1 != n { sub(/^[a-z]+:\/\//, "", $2); print $2 }')
          			listed=$(sed 's|^[a-z]*://||' "${file}")
          			[ -n "${behind}" ] && [ -n "${listed}" ] || continue
          			printf '%s\n' "${behind}" | grep -qxF "${listed}" || continue
          		fi
          		printf '%s\n' "${new}" > "${file}"
          		changed=1
          		echo "armbian-acng-start: ${repo}: $(tr '\n' ' ' < "${file}")"
          	done
          	return "${changed}"
          }

          # Wait for the background process $1 and return its status.
          # apt-cacher-ng stopped: exit, and Docker restarts the container.
          watch() {
          	while kill -0 "${1}" 2> /dev/null; do
          		sleep 2 &
          		wait $!
          		kill -0 "${pid}" 2> /dev/null || exit 1
          	done
          	wait "${1}"
          }

          trap 'kill "${pid}" 2> /dev/null; wait "${pid}"; exit 0' INT TERM
          # Serve at once with the current lists. The first update follows right away.
          # update and sleep run in the background: a stop does not wait for them.
          mode=start
          while :; do
          	/usr/sbin/apt-cacher-ng -c "${conf}" &
          	pid=$!
          	while :; do
          		update "${mode}" &
          		watch $!
          		rc=$?
          		mode=refresh
          		[ "${rc}" = 0 ] || break
          		sleep "${interval}" &
          		watch $!
          	done
          	echo "armbian-acng-start: mirror list changed, restart apt-cacher-ng"
          	kill "${pid}"
          	wait "${pid}"
          done
          EOS

          VOLUME ["/var/cache/apt-cacher-ng"]
          EXPOSE 3142

          CMD ["/usr/local/sbin/armbian-acng-start"]
          DOCKEREOF

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/apt-cacher-ng:latest
            ${{ env.REGISTRY }}/apt-cacher-ng:trixie
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          load: false

      - name: Image built
        run: |
          echo "::notice::Built and pushed ${{ env.REGISTRY }}/apt-cacher-ng:latest (linux/amd64, linux/arm64)"
          echo '# apt-cacher-ng image' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "Pushed \`${{ env.REGISTRY }}/apt-cacher-ng:latest\` and \`:trixie\` (linux/amd64, linux/arm64) ✅" >> $GITHUB_STEP_SUMMARY
